<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consultation de timeline</title>
  <style>
    :root { color-scheme: light; font-family: sans-serif; }
    body { margin: 0; min-height: 100vh; background: #eff3f1; color: #15283a; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; background: #fffdf9; border-bottom: 1px solid #cfd8d8; }
    h1 { margin: 0; font-size: 18px; }
    a { border: 1px solid #118ed1; border-radius: 5px; padding: 8px 10px; color: white; background: #118ed1; font-weight: 700; text-decoration: none; }
    iframe { display: block; width: 100%; height: calc(100vh - 68px); border: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Timeline</h1>
    <a id="open-timeline" href="#" target="_blank" rel="noopener">Ouvrir dans un nouvel onglet</a>
  </header>
  <iframe id="timeline" title="Timeline en consultation"></iframe>

  <script>
    // Remplacez cette valeur par le lien cree avec le bouton "Partager" de Timeline.
    const consultationLink = "http://127.0.0.1:5500/?view=b282bc39-bd78-4612-870b-9ddc4c7a38fc";

    document.querySelector("#timeline").src = consultationLink;
    document.querySelector("#open-timeline").href = consultationLink;
  </script>
</body>
</html>
